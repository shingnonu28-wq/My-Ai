name: NANP AI - Auto Build

on:
  push:
    branches: [ "main", "feature-improvements" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK cmdline-tools
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
          sudo mkdir -p /usr/local/lib/android/sdk/licenses
          cd /usr/local/lib/android/sdk/cmdline-tools
          sudo curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip cmdline-tools.zip -d latest
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Set ANDROID_HOME and PATH
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/build-tools/34.0.0" >> $GITHUB_ENV

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NANP-AI-APKs
          path: |
            app/build/outputs/**/*.apk
