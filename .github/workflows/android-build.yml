name: NANP AI - Auto Build (No Gradle)

on:
  push:
    branches:
      - main
      - feature-improvements
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find or build APKs
        run: |
          echo "🔍 Checking for APKs in releases/ ..."
          mkdir -p output-apks
          if ls releases/*.apk 1> /dev/null 2>&1; then
            echo "📦 Found existing APKs in releases/ folder."
            cp releases/*.apk output-apks/
          else
            echo "⚠️ No prebuilt APK found, trying Gradle fallback..."
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleDebug assembleRelease || echo "Gradle build failed."
              find . -type f -name "*.apk" -exec cp {} output-apks/ \;
            else
              echo "❌ No gradlew found and no APK provided. Skipping build."
            fi
          fi
          ls -R output-apks || echo "No APKs collected."

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NANP-AI-APKs
          path: output-apks
